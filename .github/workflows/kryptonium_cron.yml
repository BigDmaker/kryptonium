name: Kryptonium 24/7 Cloud Assistant

on:
  schedule:
    # Läuft alle 4 Stunden automatisch (Cloud-Server von GitHub)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten mit 1 Klick auf GitHub

jobs:
  run-kryptonium:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten & Playwright installieren
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Kryptonium Scanner & Generator ausführen
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          python kryptonium_cloud.py

      - name: Status (processed_homeworks) speichern falls geändert
        run: |
          git config --global user.name "Kryptonium Bot"
          git config --global user.email "kryptonium@bot.local"
          git add processed_homeworks.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed homeworks [skip ci]" && git push)
        continue-on-error: true
